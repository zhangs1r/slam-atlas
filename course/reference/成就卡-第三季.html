<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成就卡 · 视觉主干驾驶员 — SLAM 论文精读课</title>
<style>
  :root{
    --paper:#fdfbf7; --card1:#ce7c58; --card2:#a85e48; --card3:#5c3a40;
    --ink:#2d2320; --ink60:#6b5a51; --ink40:#9c8b82;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 48px;
    background:radial-gradient(circle at 50% 0%, #f6ede4 0%, #efe4d9 60%, #e7dbcf 100%);
    font-family:"Noto Serif SC", Inter, system-ui, sans-serif;
    color:var(--ink);
  }
  .wrap{max-width:760px; margin:0 auto}
  .holo-card{
    position:relative; border-radius:22px; overflow:hidden;
    background:linear-gradient(150deg, var(--card1) 0%, var(--card2) 52%, var(--card3) 100%);
    box-shadow:0 18px 50px rgba(90,54,38,.32), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .holo-card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.30) 45%, transparent 60%);
    transform:translateX(-120%);
    animation:sweep 4.6s ease-in-out infinite;
  }
  @keyframes sweep{ 0%{transform:translateX(-120%)} 55%{transform:translateX(120%)} 100%{transform:translateX(120%)} }
  .inner{position:relative; z-index:1; padding:26px 26px 20px}
  .topline{
    display:flex; justify-content:space-between; align-items:center;
    font-family:Inter, system-ui, sans-serif; font-size:11px;
    letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,246,238,.82);
  }
  .rarity{display:inline-flex; align-items:center; gap:6px}
  .rarity .dot{
    width:9px; height:9px; border-radius:50%; background:#ffd88a;
    box-shadow:0 0 9px rgba(255,216,138,.9);
  }
  .art{
    position:relative; height:210px; margin:8px 0 4px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute; border-radius:50%; border:1px solid rgba(255,246,238,.26);
    left:50%; top:50%; transform:translate(-50%,-50%);
  }
  .r1{width:150px; height:150px; animation:spin 26s linear infinite}
  .r2{width:194px; height:194px; border-style:dashed; animation:spin 40s linear infinite reverse}
  .r3{width:238px; height:238px; opacity:.55; animation:spin 60s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .art svg{position:relative; z-index:2; width:196px; height:196px}
  .title{
    font-size:31px; font-weight:900; letter-spacing:.02em; color:#fff8f2;
    text-align:center; text-shadow:0 2px 14px rgba(70,38,26,.45);
  }
  .subtitle{
    text-align:center; margin-top:6px; font-size:13px;
    color:rgba(255,244,235,.86); font-family:Inter, system-ui, sans-serif;
  }
  .divider{
    height:1px; margin:16px 0 14px;
    background:linear-gradient(90deg, transparent, rgba(255,246,238,.5), transparent);
  }
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center}
  .stat b{
    display:block; font-size:24px; color:#fff8f2;
    font-family:Inter, system-ui, sans-serif;
  }
  .stat span{font-size:11px; color:rgba(255,244,235,.76); letter-spacing:.08em}
  .foot{
    margin-top:16px; padding-top:12px;
    border-top:1px dashed rgba(255,246,238,.3);
    display:flex; justify-content:space-between; align-items:center;
    font-size:11px; color:rgba(255,244,235,.72);
    font-family:Inter, system-ui, sans-serif;
  }
  .note{
    margin-top:24px; background:#fffdfa; border:1px solid #e8d9cc; border-radius:18px;
    padding:22px 24px; box-shadow:0 8px 26px rgba(120,86,64,.10);
  }
  .note h2{margin:0 0 12px; font-size:19px}
  .note p{margin:0 0 10px; line-height:1.75; font-size:14.5px; color:var(--ink60)}
  .note b{color:var(--ink)}
  table{width:100%; border-collapse:collapse; margin:12px 0 6px; font-size:13.5px}
  th,td{border:1px solid #ecdfd3; padding:8px 10px; text-align:left; vertical-align:top}
  th{background:#faf2ea; color:var(--ink); font-weight:700}
  td{color:var(--ink60)}
  ul{margin:12px 0 0; padding-left:20px}
  li{line-height:1.8; font-size:14.5px; color:var(--ink60); margin-bottom:6px}
  code{
    background:#f4ece4; padding:1px 6px; border-radius:5px;
    font-family:"JetBrains Mono", ui-monospace, monospace; font-size:12.5px; color:#a8563a;
  }
  .back{
    display:inline-block; margin-top:16px; padding:9px 18px; border-radius:999px;
    background:#ce7c58; color:#fff; text-decoration:none; font-size:14px;
    font-family:Inter, system-ui, sans-serif;
  }
  .back:hover{background:#b8663f}

  /* ══════════════════════════════════════════════════════════
     跟随系统深浅色（prefers-color-scheme: dark）
     奖卡本体本来就是深色设计（浅色模式下也是深底），所以这里只翻
     「页面底色与下方说明面板」；卡片自身的渐变与文字保持不变。
     ══════════════════════════════════════════════════════════ */
  @media screen and (prefers-color-scheme: dark){
    :root{ --ink:#efe7df; --ink60:#b3a79f; --ink40:#8d827b; --paper:#241d1a; }
    body{ background:radial-gradient(circle at 50% 0%, #2b231e 0%, #1f1916 60%, #14100e 100%); }
    .note{ background:var(--paper); border-color:#3b332e; box-shadow:0 8px 26px rgba(0,0,0,.42); }
    .note h2,.note b,.note strong{ color:#efe7df; }
    .note p,.note li{ color:#b3a79f; }
    table{ background:transparent; }
    th,td{ border-color:#3b332e; color:#b3a79f; }
    th{ background:rgba(204,120,92,.18); color:#efe7df; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="holo-card">
    <div class="inner">
      <div class="topline">
        <span>Slam Atlas · 第三季</span>
        <span class="rarity"><i class="dot"></i>Legendary</span>
      </div>

      <div class="art">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- 一台相机 + 一条轨迹 + 房间 -->
          <polygon points="22,150 178,150 160,96 40,96" fill="rgba(255,246,238,0.10)"/>
          <polygon points="40,96 160,96 150,56 50,56" fill="rgba(255,246,238,0.07)"/>
          <line x1="40" y1="96" x2="160" y2="96" stroke="rgba(255,248,242,0.42)" stroke-width="1.4"/>
          <line x1="22" y1="150" x2="178" y2="150" stroke="rgba(255,248,242,0.28)" stroke-width="1.2"/>
          <!-- 房间里的家具 -->
          <rect x="52" y="112" width="30" height="24" rx="3" fill="rgba(255,238,220,0.26)" stroke="rgba(255,248,242,0.5)"/>
          <rect x="128" y="106" width="26" height="30" rx="3" fill="rgba(255,238,220,0.20)" stroke="rgba(255,248,242,0.45)"/>
          <!-- 轨迹 -->
          <path d="M28,140 C64,124 96,108 128,102 C154,97 174,108 184,126"
                fill="none" stroke="rgba(255,246,238,0.85)" stroke-width="2.2" stroke-dasharray="6,4"/>
          <!-- 三台相机 -->
          <g fill="rgb(255,247,240)" stroke="rgb(126,72,52)" stroke-width="1.3">
            <rect x="34" y="130" width="17" height="12" rx="2.5"/>
            <rect x="92" y="100" width="17" height="12" rx="2.5"/>
            <rect x="150" y="100" width="17" height="12" rx="2.5"/>
          </g>
          <circle cx="51" cy="136" r="3.4" fill="none" stroke="rgb(126,72,52)" stroke-width="1.3"/>
          <circle cx="109" cy="106" r="3.4" fill="none" stroke="rgb(126,72,52)" stroke-width="1.3"/>
          <circle cx="167" cy="106" r="3.4" fill="none" stroke="rgb(126,72,52)" stroke-width="1.3"/>
          <!-- 视锥 -->
          <polygon points="51,136 80,110 80,158" fill="rgba(255,246,238,0.14)"/>
          <polygon points="167,106 190,112 186,150" fill="rgba(255,246,238,0.12)"/>
          <!-- 地图点：稀疏 + 稠密两种 */
          <g fill="rgb(255,240,214)">
            <circle cx="66" cy="80" r="2.1"/><circle cx="88" cy="72" r="2.1"/>
            <circle cx="112" cy="64" r="2.1"/><circle cx="134" cy="70" r="2.1"/>
            <circle cx="156" cy="62" r="2.1"/>
          </g>
          <g fill="none" stroke="rgba(255,236,206,0.5)" stroke-width="0.9">
            <circle cx="66" cy="80" r="4.2"/><circle cx="112" cy="64" r="4.2"/><circle cx="156" cy="62" r="4.2"/>
          </g>
        </svg>
      </div>

      <div class="title">视觉主干驾驶员</div>
      <div class="subtitle">阶段 C · 视觉主干（特征法 / 直接法 / VIO）</div>

      <div class="divider"></div>

      <div class="stats">
        <div class="stat"><b>42</b><span>篇论文</span></div>
        <div class="stat"><b>37</b><span>节课</span></div>
        <div class="stat"><b>7</b><span>模块</span></div>
      </div>

      <div class="foot">
        <span>Slam Atlas · 第三季</span>
        <span>2026-09-18</span>
      </div>
    </div>
  </div>

  <div class="note">
    <h2>🏅 解锁说明</h2>
    <p>这张卡对应<b>阶段 C「视觉主干」</b>这个来源块。把该块下的全部课程标记为已完成，卡片会自动从灰变亮。</p>
    <p>进度保存在你浏览器的 localStorage（键名 <code>paperlesson_done</code>），不上传任何服务器。</p>

    <p style="margin-top:.8rem"><b>这一季还清的第二季两笔债：</b></p>
    <table>
      <tr><th>第二季的悬念</th><th>在本季哪几节还清</th></tr>
      <tr><td>④ 「提取 vs 不提取特征」为什么来回摆动</td><td>0046 DTAM → 0047 LSD-SLAM → 0048 DSO → 0050 SVO，一条完整的摆动史</td></tr>
      <tr><td>⑤ IMU 初始化到底怎么做</td><td>0057 VINS-Mono 的联合初始化 · 0064 只用惯性的初始化</td></tr>
      <tr><td>（顺带）0032 边缘化的进阶版</td><td>0049 VI-DSO 的动态边缘化 · 0063 DM-VIO 的延迟边缘化</td></tr>
    </table>

    <p style="margin-top:.8rem"><b>这一季的主线：</b></p>
    <table>
      <tr><th>模块</th><th>回答的问题</th></tr>
      <tr><td>1 特征点路线</td><td>从 EKF 到三线程：架构怎么一步步演化出来的</td></tr>
      <tr><td>2 直接法与半直接法</td><td>误差可以不算在像素位置上，而算在灰度值上</td></tr>
      <tr><td>3 RGB-D 稠密 SLAM</td><td>有现成深度就轻松了？其实换来一个新矛盾</td></tr>
      <tr><td>4 学习式稠密 SLAM</td><td>深度学习能提供的是「先验」，而不是「答案」</td></tr>
      <tr><td>5 VIO 主干</td><td>优化派与滤波派之争，以及 IMU 到底补了什么</td></tr>
      <tr><td>6 GNSS 与自动驾驶</td><td>走出室内之后，尺度与全局一致靠什么</td></tr>
      <tr><td>7 动态环境与鲁棒性</td><td>真实世界的行人、光照、弱纹理、算力约束</td></tr>
    </table>

    <ul>
      <li><b>为什么是 Legendary：</b>这是三季里<b>篇数最多</b>的一季（42 篇），也是唯一一季覆盖了「从 2007 到 2025」这样完整的时间跨度。</li>
      <li><b>本季的独家内容：</b>四象限坐标系（直接 ≠ 稠密）、光度标定的三件事、动态边缘化的三个先验接力、ERT 一致性、伪距与载波相位的差别、消失点与线特征参数化。</li>
      <li><b>本季新增的教学规矩：</b>凡是晦涩抽象、原文又没有好图的地方，都配一张<b>具象自绘图</b>——画面里出现的是真实的房间、相机、桌子、卫星，而不是抽象的点线方块。图上出现的曲线与数值点，都是用真实公式算出来的，可以拿计算器验算。</li>
      <li><b>还没还的债：</b>③ ikd-Tree → 阶段 D；3DGS 的自适应密度控制 → 阶段 F；神经隐式 SLAM 怎么把 NeRF 塞进 SLAM 循环 → 0076 与阶段 F。</li>
    </ul>

  </div>

</div>
