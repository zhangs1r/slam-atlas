<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slam Atlas · SLAM 论文精读地图</title>
<meta http-equiv="refresh" content="2;url=course/index.html">
<meta name="description" content="255 篇 SLAM 论文 → 五季 94 节课的中文精读课程体系。">
<style>
  :root{
    --paper:#FBF9F5;
    --paper-2:#F4EFE7;
    --ink:#2E2A26;
    --ink-2:#8A8178;
    --terra:#CC785C;
    --terra-dark:#B3654B;
    --rule:#E4DCD0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:640px;width:100%;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 48px 44px;
    text-align:center;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--terra);font-weight:500;margin-bottom:22px;
  }
  h1{
    font-family:"Noto Serif SC","Songti SC",Georgia,serif;
    font-size:44px;line-height:1.15;margin:0 0 14px;
    font-weight:600;letter-spacing:-.01em;
  }
  h1 .hyphen{color:var(--terra);}
  .lede{
    font-size:15px;line-height:1.75;color:var(--ink-2);
    margin:0 auto 32px;max-width:440px;
  }
  .stats{
    display:flex;justify-content:center;gap:0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    padding:18px 0;margin-bottom:34px;
  }
  .stat{flex:1;padding:0 8px;border-right:1px solid var(--rule);}
  .stat:last-child{border-right:0;}
  .stat b{
    display:block;font-family:"Noto Serif SC",Georgia,serif;
    font-size:23px;font-weight:600;color:var(--ink);line-height:1.2;
  }
  .stat span{font-size:13px;color:var(--ink-2);line-height:1.6;}
  .enter{
    display:inline-block;
    background:var(--terra);color:#fff;text-decoration:none;
    padding:14px 40px;border-radius:8px;
    font-size:15px;font-weight:500;
    transition:background .15s ease;
  }
  .enter:hover{background:var(--terra-dark);}
  .foot{margin-top:22px;font-size:12.5px;color:var(--ink-2);}
  .foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule);}
  .foot a:hover{color:var(--terra);border-color:var(--terra);}
  @media (max-width:560px){
    .card{padding:40px 24px 32px;}
    h1{font-size:32px;}
    .stats{flex-wrap:wrap;gap:14px 0;}
    .stat{flex:1 1 50%;border-right:0;}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SLAM 论文精读地图</div>
    <h1>Slam<span class="hyphen">·</span>Atlas</h1>
    <p class="lede">
      把 255 篇 SLAM 论文读成一条线 —— 从 2000 年的束调整，到 2025 年的 3D 高斯泼溅。
      每节课都指回前置章节，讲清一个概念是怎么长出来的。
    </p>

    <div class="stats">
      <div class="stat"><b>255</b><span>篇论文</span></div>
      <div class="stat"><b>5</b><span>个阶段</span></div>
      <div class="stat"><b>94</b><span>节课</span></div>
      <div class="stat"><b>2000–2025</b><span>时间跨度</span></div>
    </div>

    <a class="enter" href="course/index.html">进入课程</a>
    <p class="foot">
      2 秒后自动跳转 · 也可以直接去
      <a href="outputs/论文阅读路线图.html">全量阅读路线图</a> 或
      <a href="md/index.html">论文原文索引</a>
    </p>
    <p class="foot">
      <a href="https://zhangs1r.github.io/lessonworkspace/">📚 返回 LessonWorkspace</a>
    </p>
  </main>
</body>
</html>
